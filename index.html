<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNA - Астрологи, Руна & Тоон Зурхай</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at center, #0f231c 0%, #050b09 100%);
            color: #f1f5f9; 
            font-family: 'Montserrat', sans-serif; 
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .gold-gradient-text {
            background: linear-gradient(135deg, #ffe89c 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border { border: 1px solid rgba(212, 175, 55, 0.4); }
        .gold-btn { 
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #996515 100%);
            color: #03120d; 
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .glass-card { 
            background: rgba(12, 32, 25, 0.85); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen justify-center">

    <div class="max-w-md w-full glass-card p-6 sm:p-8 rounded-3xl shadow-2xl space-y-6 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="text-2xl tracking-widest text-yellow-300">ᚱ ᚢ ᚾ ᚨ</div>
            <h1 class="text-4xl cinzel font-bold gold-gradient-text">RUNA</h1>
            <p class="text-xs text-amber-200/80 tracking-wide uppercase">Руна Тэмдэг, Тоон Зурхай & Гүн Ухаан</p>
        </div>

        <hr class="border-amber-500/20">

        <!-- Form Steps -->
        <div id="quiz-container" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-amber-200 mb-1 font-semibold">Өөрийн нэр:</label>
                <input type="text" id="userName" placeholder="Нэрээ оруулна уу" class="w-full p-3.5 rounded-xl bg-black/40 gold-border text-white text-sm focus:outline-none">
            </div>

            <div>
                <label class="block text-xs uppercase text-amber-200 mb-1 font-semibold">Төрсөн он, сар, өдөр:</label>
                <input type="date" id="userDob" class="w-full p-3.5 rounded-xl bg-black/40 gold-border text-white text-sm focus:outline-none">
            </div>

            <div>
                <label class="block text-xs uppercase text-amber-200 mb-1 font-semibold">Санхүү болон Амьдралын асуудал:</label>
                <select id="userIssue" class="w-full p-3.5 rounded-xl bg-black/40 gold-border text-amber-100 text-sm focus:outline-none">
                    <option value="Орлого ордог ч шууд урсаад гарчихдаг">💸 Орлого ордог ч шууд урсаад гарчихдаг</option>
                    <option value="Гэнэтийн зарлага, өр авлага их үүсдэг">⚠️ Гэнэтийн зарлага, өр авлага их үүсдэг</option>
                    <option value="Шинэ боломж, орлогын үүд нээгдэхгүй байна">🔒 Шинэ боломж, орлогын үүд нээгдэхгүй байна</option>
                    <option value="Хайр дурлал, харилцааны тэнцвэр алдагдсан">💖 Хайр дурлал, харилцааны тэнцвэр алдагдсан</option>
                </select>
            </div>

            <button onclick="showPayment()" class="w-full py-4 rounded-xl gold-btn text-base mt-2 tracking-wider uppercase cinzel">
                Уншилт Бэлтгэх (9,900₮)
            </button>
        </div>

        <!-- QPay Modal -->
        <div id="payment-modal" class="hidden text-center space-y-4 py-2">
            <h2 class="text-2xl cinzel font-bold gold-gradient-text">QPay Төлбөр Төлөх</h2>
            <p class="text-xs text-amber-100/80">QR кодыг уншуулан төлбөрөө баталгаажуулна уу.</p>
            
            <div class="bg-white p-3 rounded-2xl inline-block shadow-lg border-2 border-yellow-400">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=RUNA_QPAY_INVOICE" alt="QPay QR" class="rounded-lg">
            </div>

            <button onclick="generateReading()" class="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow-lg hover:bg-emerald-500 transition">
                Төлбөр Төлөгдсөн (AI Уншилт Эхлүүлэх)
            </button>
        </div>

        <!-- AI Reading Result Area -->
        <div id="result-container" class="hidden space-y-4 py-2">
            <h2 class="text-xl cinzel font-bold gold-gradient-text text-center">Таны Их Руна & Зурхайн Тайлал</h2>
            
            <div id="loading" class="text-center py-6 text-amber-200 text-sm animate-pulse">
                ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ Руна тэмдэг ба тоон зурхайг уншиж байна...
            </div>

            <div id="ai-reading-text" class="text-xs leading-relaxed text-emerald-100/90 bg-black/50 p-4 rounded-2xl gold-border max-h-96 overflow-y-auto whitespace-pre-line">
            </div>
        </div>

    </div>

    <script>
        const OPENAI_API_KEY = "YOUR_OPENAI_API_KEY_HERE";

        function showPayment() {
            const name = document.getElementById('userName').value;
            const dob = document.getElementById('userDob').value;
            if(!name || !dob) { alert('Нэр болон төрсөн өдрөө бүрэн оруулна уу!'); return; }
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        async function generateReading() {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            const name = document.getElementById('userName').value;
            const dob = document.getElementById('userDob').value;
            const issue = document.getElementById('userIssue').value;

            Үйлчлүүлэгч:
            - Нэр: ${name}
            - Төрсөн огноо: ${
